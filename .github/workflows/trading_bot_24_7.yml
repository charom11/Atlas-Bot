name: ⚡ Weather-Ensemble AI 24/7 Live Trading Runner

on:
  schedule:
    # Triggers every 5 hours to ensure continuous 24/7 coverage
    - cron: '0 */5 * * *'
  workflow_dispatch:
    inputs:
      duration_hours:
        description: 'Session Duration (Hours)'
        required: false
        default: '5.5'

jobs:
  trade_session:
    name: 🚀 Live Futures Execution Session
    runs-on: ubuntu-latest
    timeout-minutes: 360 # GitHub maximum job limit (6 hours)

    steps:
      - name: 📥 Checkout Codebase
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install rich websocket-client ccxt

      - name: ⚡ Run Weather-Ensemble AI Live Trading Agent
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_NOTIFICATIONS: 'true'
        run: |
          echo "Starting 24/7 Live Trading Session on GitHub Actions..."
          python -u weather_ensemble_bot.py --trade-live --sizing-mode margin --margin-pct 0.03 --leverage 50 --threshold 30 --timeframe 15m --max-positions 5
