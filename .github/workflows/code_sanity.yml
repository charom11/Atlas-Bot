name: Atlas Bot Code Sanity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest rich websocket-client ccxt
      - name: Compile Python sources
        run: |
          python -m py_compile main.py core/main.py trading_safety.py risk_guard.py scripts/repo_safety_audit.py
      - name: Run repository safety audit
        run: python scripts/repo_safety_audit.py
      - name: Run safety tests
        run: |
          python -m pytest -q tests
      - name: Validate CLI entrypoint
        run: |
          python -u main.py --help >/tmp/atlas-help.txt
          grep -q -- '--trade-live' /tmp/atlas-help.txt
          grep -q -- '--sizing-mode' /tmp/atlas-help.txt
          grep -q -- '--margin-pct' /tmp/atlas-help.txt
          grep -q -- '--leverage' /tmp/atlas-help.txt
          grep -q -- '--threshold' /tmp/atlas-help.txt
          grep -q -- '--timeframe' /tmp/atlas-help.txt
          grep -q -- '--max-positions' /tmp/atlas-help.txt
